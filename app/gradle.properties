# --- Performance Optimizations ---

# Enable the Build Cache (Reuses outputs from previous builds)
org.gradle.caching=true

# Enable the Configuration Cache (Speeds up the 'Configure' phase significantly)
org.gradle.configuration-cache=true

# Execute independent tasks in parallel
org.gradle.parallel=true

# Configure only projects relevant to the requested task
org.gradle.configureondemand=true

# Enable file system watching (Reduces disk I/O checks)
org.gradle.vfs.watch=true

# --- Android Standard Settings ---
android.useAndroidX=true
android.enableJetifier=true

# JVM Memory Allocation (Adjust if your device crashes)
# 2GB is usually safe for AndroidIDE on modern phones. 
# If it crashes, lower to -Xmx1536m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options="-Xmx1096m"
